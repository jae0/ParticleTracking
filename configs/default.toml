# ==============================================================================
# default.toml - Generic Baseline Configuration
#
# Purpose
#   A low-cost, self-contained run for verifying the installation, exercising the
#   eight-segment pipeline, and producing a quick end-to-end result. It uses a
#   coarse grid and simple open/synthetic data, so it needs no dataset downloads
#   and typically finishes in a couple of minutes on CPU.
#
#   Use configs/snowcrab.toml for the production, species-calibrated run.
#
# Run
#   julia --project=. ParticleTrackingRun.jl --all --config=configs/default.toml
# ==============================================================================

[metadata]
name = "ParticleTracking Baseline Run"
description = "Generic low-resolution demonstration of the regional circulation and Lagrangian particle-tracking pipeline, using synthetic bathymetry and analytical wind stress"
author = "ParticleTracking contributors"
version = "1.0.0"

[data]
# "synthetic" keeps the run fully offline: an analytical shelf bathymetry is
# generated and wind stress comes from a closed-form drag law. Set "real" to pull
# ETOPO 2022 bathymetry and ERA5 winds through NumericalEarth.jl instead.
data_mode = "synthetic"
bathy_dataset_id = "synthetic"    # Analytical shelf profile (no download)
wind_dataset_id = "synthetic"     # Closed-form Large & Pond wind stress (no download)
hydrography_source = "synthetic"  # Analytic T/S stratification
wind_time_iso = "2020-06-01T00:00:00Z"  # Unused in synthetic mode; kept for schema parity
inshore_depth = -20.0            # Depth at the landward edge of the synthetic shelf (m)
shelf_slope = 500.0              # Scale of the synthetic continental slope (m)

[climate]
# Baseline (no perturbation). Switch to ssp126 / ssp245 / ssp585 / mhw to apply a
# scenario anomaly via climate_scenarios.jl.
scenario = "climatology"
projection_year = 2022   # Target year for CMIP6-style scenarios.
baseline_year = 2020     # Reference year for anomaly calculation.
horizon_year = 2050      # Benchmark projection horizon for the delta scaling.

[domain]
# Study domain: the computational grid and analysis region.
lon_min = -68.0
lon_max = -57.0
lat_min = 42.0
lat_max = 47.5
z_min = -3000.0
z_max = 0.0
buffer_km = 50.0        # Spatial buffer for particle seeding (km)

# Embedding domain: the larger region boundary/forcing data would be drawn from.
# Unused in synthetic mode, but declared so the schema is complete and switching
# data_mode to "real" works without editing this file.
embedding_lon_min = -71.0
embedding_lon_max = -53.0
embedding_lat_min = 40.0
embedding_lat_max = 48.5

[grid]
# Coarse grid: ~11 km cells, so a full run is cheap. Raise nx/ny for real work.
nx = 60
ny = 45
nz = 10
resolution_scale = 1.0
# "tanh" refines resolution toward the surface and seabed; "uniform" is plain layers.
vertical_stretching_mode = "tanh"
vertical_grid_file = "inputs/scotian_shelf_vertical_grid.csv"  # Only read when mode = "csv"

[bathymetry]
source = "synthetic"        # Generated analytically, no network access
provider = "synthetic"
resolution_arcsec = 60       # Coarser "resolution" to match the coarse grid
fallback_dataset_id = "synthetic"
inshore_depth = -20.0
shelf_slope = 500.0

[atmosphere]
# Analytical wind stress (Large & Pond 1981) rather than ERA5, so the run is offline.
source = "era5_climatology"
climatology = true
variables = ["u10", "v10"]
drag_formulation = "garratt_1977"   # Cd = (0.75 + 0.067*U10)*1e-3
bulk_heat_flux = true

[boundaries]
# Lateral sponge. Disabled for this baseline: the sponge/tidal interior forcing is not yet
# wired into the NumericalEarth.ocean_simulation forcing interface with an isbits kernel
# signature, so it is off here rather than silently dropped mid-run. Set
# boundary method to "none" is explicit; to re-enable relaxation, see the note in
# configs/snowcrab.toml and the forcing wiring in src/hydrodynamic_model.jl.
method = "none"
parent_ocean = "synthetic"
ocean_boundary_source = "synthetic"    # Synthetic mode: no GLORYS download, no OBC sponge
climatology = true
obc_type = "flather_chapman"
active_boundaries = ["east", "south", "west"]
sponge_layer_width = 0.25          # Sponge thickness in degrees
sponge_timescale_seconds = 3600.0  # Relaxation timescale (1 hour)
u_inflow = -0.15                   # Along-shelf inflow (m/s)
v_inflow = 0.05                    # Cross-shelf inflow (m/s)

embedding_lon_min = -71.0
embedding_lon_max = -53.0
embedding_lat_min = 40.0
embedding_lat_max = 48.5

[tides]
# Astronomical tidal forcing. Disabled for this baseline for the same reason as the
# sponge above: tidal interior forcing is not yet expressed with an isbits kernel
# signature for the ocean_simulation forcing interface.
tides_source = "analytic"
constituents = []
enable_tides = false
tidal_u_amp = 0.25      # M2 semi-major amplitude (m/s)
tidal_v_amp = 0.12      # M2 semi-minor amplitude (m/s)
s2_u_amp = 0.11         # S2 semi-major amplitude (m/s)
s2_v_amp = 0.05         # S2 semi-minor amplitude (m/s)
tidal_period = 44712.0  # M2 period (s)
tidal_phase = 0.0

[bottom_boundary_layer]
cd_drag = 0.0025                # Quadratic bottom drag coefficient
bottom_drag = 0.0001            # Background linear friction (1/s)
bbl_mixing_closure = "tke"      # Vertical mixing closure family

[hydrodynamics]
# Short integration: enough to spin up the circulation, not enough to be a
# climatology. Increase sim_duration_hours for production.
sim_duration_hours = 12.0
sim_dt_seconds = 120.0
adaptive_cfl = true
target_cfl = 0.2
target_wave_cfl = 0.2
max_dt_seconds = 600.0
min_dt_seconds = 2.0
coriolis_latitude = 44.5        # Informational; ocean_simulation uses a spherical Coriolis
divergence_velocity_limit = 20.0
surface_heat_flux = 50.0        # Net surface heat flux (W/m²)
turbulence_closure = "nemotke"  # NEMO-TKE vertical mixing
enable_sea_ice = false          # Freezing diagnostics off for the fast run
enable_oxygen = false           # No biogeochemistry in the baseline
output_schedule_seconds = 3600.0
hydro_model_file = "hydrodynamics_default.jld2"
enable_checkpoint = true

[tessellation]
# Voronoi units for connectivity analysis. Small N keeps the baseline quick.
enable_voronoi = true
n_units = 200
bathymetry_source = "synthetic"
core_depth_min = 50.0
core_depth_max = 350.0
core_prob = 0.8
prob_core = 0.8
core_min_res_km = 1.5
min_res_core_km = 1.5
shallow_depth_min = 0.0
shallow_depth_max = 50.0
shallow_prob = 0.1
prob_shallow = 0.1
shallow_min_res_km = 5.0
min_res_shallow_km = 5.0
deep_depth_min = 350.0
deep_depth_max = 6000.0
deep_prob = 0.1
prob_deep = 0.1
deep_min_res_km = 10.0
min_res_deep_km = 10.0
slope_weighting = true
slope_factor = 15.0

[biology]
# Generic pelagic-plankton defaults: no species-specific calibration. Replace the
# biology / dvm / molting_and_settlement values with those of the target organism
# for a real dispersal study.
n_particles = 100
track_duration_days = 10.0
track_dt_seconds = 300.0
min_seabed_depth = 50.0
diffusivity_h = 10.0
diffusivity_v = 1e-4
release_depth_mode = "bottom"
bottom_release_offset = [0.5, 3.0]
enable_initial_ascent = true
ascent_speed = 0.010
ascent_target_depth = -10.0
buffer_km = 50.0

[dvm]
# Stage-dependent diel vertical migration. The stage names are generic; map them
# to real life stages via the config when a species is specified.
enable_dvm = true
zoea1_day_depth = -50.0
zoea1_night_depth = -10.0
zoea2_day_depth = -55.0
zoea2_night_depth = -8.0
megalopa_day_depth = -120.0
megalopa_night_depth = -60.0
zoea2_depth_factor = 1.0
megalopa_swim_factor = 1.0

[molting_and_settlement]
# Generic degree-day phenology. The thresholds below are placeholders that produce
# a complete cohort over the tracking window; they are NOT species measurements.
enable_molting = true
t_base = -1.5
dd_zoea1_to_zoea2 = 65.0
dd_zoea2_to_megalopa = 130.0
dd_megalopa_to_settle = 200.0
settlement_min_depth = -350.0
settlement_max_depth = -50.0
settlement_max_temp = 6.0
mortality_base = 0.01
mortality_thermal_threshold = 15.0
mortality_thermal_sensitivity = 0.02
mortality_cold_threshold = 0.0
mortality_cold_sensitivity = 0.01

[storage]
output_filename = "default.jld2"
output_schedule_seconds = 3600.0
checkpoint_fields = ["u", "v", "w", "T", "S"]
enable_duckdb = true
duckdb_path = "outputs/default/default.duckdb"
enable_checkpoint = true
checkpoint_prefix = "default_checkpoint"
checkpoint_schedule = 3600.0
checkpoint_schedule_seconds = 3600.0
checkpoint_dir = "outputs/default/checkpoints"
cleanup_checkpoints = true
auto_restart = true

[hardware]
# CPU by default: this is a coarse verification grid, and the run is dominated by
# compilation rather than compute. Set use_gpu = true to exercise the CUDA path.
use_gpu = false
fallback_to_cpu = true

[visualization]
interactive_map = true
title = "ParticleTracking Baseline Run"

[paths]
# All output for this configuration lands under outputs/default/, and the
# realized configuration is copied there as `resolved_config.toml` for provenance.
output_dir = "outputs/default"
input_dir = "inputs"
seed = 42
