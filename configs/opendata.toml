# ==============================================================================
# opendata.toml - Keyless / Open-Access Data Configuration
#
# Purpose
#   A production-shaped run that ingests *observed* environmental data while requiring
#   **no login, API key, or CDS credentials anywhere**. Every dataset below is served from
#   an open endpoint that works anonymously, so this config runs on a fresh machine with
#   nothing but network access.
#
#   Use this config when `copernicusmarine` / GLORYS / ERA5-via-CDS is unavailable or
#   unauthenticated. Use configs/snowcrab.toml when CDS credentials *are* available and
#   you want the higher-resolution reanalysis.
#
# Data sources (all keyless)
#   Bathymetry   ETOPO 2022 (15 arc-second)  NOAA NCEI CoastWatch ERDDAP
#   Winds        ERA5 via the Open-Meteo archive API (keyless), falling back to
#                NOAA PSL NCEP reanalysis, then to an analytical drag law
#   Hydrography  World Ocean Atlas 2023 climatology, NOAA NCEI THREDDS
#                (0.25 deg preferred, 1.00 deg fallback; no login)
#   Tides        TPXO9-Atlas (open, no registration)
#
# Trade-off versus snowcrab.toml
#   WOA23 is a *climatology* on standard depth levels at 0.25 deg, not a 1/12 deg
#   reanalysis. It is smooth and lacks interannual and mesoscale structure, so this config
#   is appropriate for climatology-scale and larval-dispersal work but is not a substitute
#   for GLORYS12V1 when resolving eddies or event-scale variability.
#
# Run
#   julia --project=. ParticleTrackingRun.jl --all --config=configs/opendata.toml
#
# The fully-resolved configuration (this file after any CLI overrides) is copied to
# work/opendata/resolved_config.toml as provenance for the outputs.
# ==============================================================================

[metadata]
name = "Snow Crab Larval Dispersal - Keyless Open Data"
description = "Species-calibrated Scotian Shelf larval tracking driven entirely by open-access datasets (ETOPO 2022, Open-Meteo ERA5 winds, WOA23 climatology) that require no login or API credentials"
author = "ParticleTracking contributors"
version = "1.0.0"

[data]
# Everything the model starts from and is driven by comes from a real published dataset that
# needs no account and no API key. There is no on/off switch for "real data", and no backup:
# if a download fails the run stops rather than quietly making something up. Nothing here is
# generated. The values this file accepts are documented once, in src/config/configuration.jl.
coastline_source = "natural_earth_10m"  # Land outline, Natural Earth, public domain
bathy_source = "etopo2022"      # Sea floor map, NOAA ERDDAP, free
wind_source = "open_meteo"      # Real past weather via a free API
wind_time_iso = "2020-06-01T00:00:00Z"  # Which moment of 2020 to take the weather from

# Where the starting temperature and salt for the whole water column come from. WOA23 is a
# monthly average of the whole ocean from NOAA: the smooth "what does the ocean look like on
# average" picture, with none of the year-to-year variation and none of the swirling eddies a
# single real year would contain. A reanalysis instead (GLORYS) does contain eddies, but
# needs an account, so it does not fit this file.
hydrography_source = "woa23"
# 0 uses the average of all twelve months, which suits a run about the average state. Set
# 1-12 to use one particular month's average instead.
hydrography_month = 0

[climate]
# Climatological baseline. Switch to ssp126 / ssp245 / ssp585 / mhw to apply a scenario
# anomaly via climate_scenarios.jl.
scenario = "climatology"
projection_year = 2022   # Target year for CMIP6-style scenarios
baseline_year = 2020     # Reference year for the anomaly calculation
horizon_year = 2050      # Benchmark projection horizon for the delta scaling

[domain]
# Study domain (Scotian Shelf): the computational grid and analysis region.
# WOA23 is requested for exactly this box, so no regridding extrapolation is needed
# horizontally. Vertically the model domain is deeper than some WOA request, so queries
# are clamped to the deepest available WOA level rather than extrapolated.
lon_min = -68.0
lon_max = -57.0
lat_min = 42.0
lat_max = 47.5
z_min = -3000.0
z_max = 0.0
buffer_km = 50.0        # Spatial buffer for particle seeding (km)

# The embedding domain is declared once, in [boundaries]. It is not repeated here.

[grid]
# Moderate resolution (~2.5 km class) so a keyless run stays tractable on CPU. This is
# coarser than snowcrab.toml's 345 x 245 x 20 because keyless runs are typically done on
# shared or laptop hardware.
nx = 145
ny = 105
nz = 15
depths = [0.0, 10.0, 20.0, 30.0, 50.0, 75.0, 100.0, 150.0, 200.0, 300.0, 450.0, 700.0, 1100.0, 1800.0, 2400.0, 3000.0]
resolution_scale = 1.0
vertical_stretching_mode = "tanh"  # Surface- and seabed-refined layers

[bathymetry]
# ETOPO 2022 is served from the NOAA CoastWatch ERDDAP, which needs no credentials.
# The dataset is named once, as `bathy_source` in [data]. There is no fallback
# dataset: if the 15-arcsec request fails the run aborts rather than silently
# substituting ETOPO 180-arcsec.
ingest_library = "numerical_earth"
resolution_arcsec = 15          # 15 arc-second (~500 m at mid-latitudes)
inshore_depth = -20.0
shelf_slope = 500.0

[atmosphere]
# What the weather does to the sea surface. Here the wind is real weather fetched for the
# date above, and it also carries air temperature, pressure, humidity, cloud cover and
# sunlight, so the model can work out how much heat the sea gains or loses each hour. Only
# this source makes the heat flux vary through the run; "era5_climatology" repeats a
# typical year, and "synthetic" is a single fixed number.
forcing = "open_meteo"
climatology = true
variables = ["u10", "v10"]
drag_formulation = "garratt_1977"   # Dynamic Cd = (0.75 + 0.067*U10)*1e-3
bulk_heat_flux = true

[boundaries]
# The band of water next to the model's open edges is eased back toward the incoming speeds
# given below, over about an hour, so the middle of the domain stays free to do its own
# thing. Those speeds are reference values for this part of the shelf.
method = "relaxation"
parent_ocean = "synthetic"
ocean_boundary_source = "woa23"
# This file exists to show what the model can do with free, account-free data, so the
# alternatives are the point of it here rather than a duplicate of the manual. The full
# comparison of every accepted value lives in src/config/configuration.jl.
#
# WOA23 is real observed data, so the outermost band of the domain is eased toward measured
# temperature and salt rather than left to invent its own. What that does NOT give you:
#   - How fast the water is moving. WOA23 carries no currents, so the inflow speed still
#     comes from u_inflow/v_inflow below. That is half an open boundary, not a whole one, and
#     any result depending on how much water crosses an edge rests on those two numbers.
#   - Tidal or storm variation at the edge. A climatology is one repeating state.
#   - CPU only. A data-backed sponge cannot be lowered into a GPU kernel, and the run refuses
#     rather than silently dropping it.
#
# The account-free alternative that would fix the first gap is HYCOM, which also carries
# currents. Its server currently refuses every data request (the catalogue works, the numbers
# do not come back), so it is wired and ready but not usable. GLORYS carries currents too and
# does work, but needs a free Copernicus Marine account -- which is exactly what this file
# exists to avoid.
climatology = true
obc_type = "flather_chapman"
active_boundaries = ["east", "south", "west"]
sponge_layer_width = 0.25
sponge_timescale_seconds = 3600.0
u_inflow = -0.15                   # Along-shelf inflow (m/s)
v_inflow = 0.05                    # Cross-shelf inflow (m/s)

embedding_lon_min = -71.0
embedding_lon_max = -53.0
embedding_lat_min = 40.0
embedding_lat_max = 48.5

[tides]
# TPXO9-Atlas is open access (no registration), unlike many tidal products.
tides_source = "tpxo9_atlas"
constituents = ["M2", "S2"]
tidal_u_amp = 0.25      # M2 semi-major amplitude (m/s)
tidal_v_amp = 0.12      # M2 semi-minor amplitude (m/s)
s2_u_amp = 0.11         # S2 semi-major amplitude (m/s)
s2_v_amp = 0.05         # S2 semi-minor amplitude (m/s)
tidal_period = 44712.0  # M2 period (s)
tidal_phase = 0.0

[bottom_boundary_layer]
cd_drag = 0.0025                # Quadratic bottom drag coefficient
bottom_drag = 0.0001            # Background linear friction (1/s)
bbl_mixing_closure = "tke"      # Vertical mixing closure family

[hydrodynamics]
# One simulated year of climatology. WOA23 is itself a climatology, so a multi-year
# integration would only spin up the circulation; extend this if you want the flow to
# adjust to the imposed atmospheric forcing.
sim_duration_hours = 8760.0
sim_dt_seconds = 180.0
adaptive_cfl = true
target_cfl = 0.2
target_wave_cfl = 0.2
max_dt_seconds = 300.0
min_dt_seconds = 2.0
coriolis_latitude = 44.5        # ocean_simulation uses a spherical Coriolis
divergence_velocity_limit = 20.0
surface_heat_flux = 50.0        # Net surface heat flux (W/m2)
turbulence_closure = "nemotke"  # NEMO-TKE vertical mixing
enable_sea_ice = true           # Freezing / frazil diagnostics
enable_oxygen = true            # Dissolved oxygen prognostic tracer
output_schedule_seconds = 21600.0
hydro_model_file = "hydrodynamics_opendata.jld2"
enable_checkpoint = true

[tessellation]
# Depth-stratified Voronoi units for release and connectivity analysis.
enable_voronoi = true
n_units = 2000
core_depth_min = 50.0
core_depth_max = 350.0
prob_core = 0.8
min_res_core_km = 1.5
shallow_depth_min = 0.0
shallow_depth_max = 50.0
prob_shallow = 0.1
min_res_shallow_km = 5.0
deep_depth_min = 350.0
deep_depth_max = 6000.0
prob_deep = 0.1
min_res_deep_km = 10.0
slope_weighting = true
slope_factor = 15.0

[biology]
# Snow crab (Chionoecetes opilio) larval parameters, as in configs/snowcrab.toml.
# References: Sainte-Marie & Sainte-Marie (1999) J. Crustacean Biol. 19(4):743-754;
# Lovrich & Sainte-Marie (1997) MEPS 148:85-99; Kuhn & Choi (2011) ICES J. Mar. Sci.
n_particles = 500
track_duration_days = 60.0          # Pelagic larval duration (PLD)
track_dt_seconds = 300.0            # 5-minute Lagrangian integration step
min_seabed_depth = 50.0             # Minimum water depth for release (m)
diffusivity_h = 10.0                # Horizontal turbulent diffusivity (m2/s)
diffusivity_v = 1e-4                # Vertical turbulent diffusivity (m2/s)
release_depth_mode = "bottom"       # Benthic release mode
bottom_release_offset = [0.5, 3.0]  # Height above seabed (m)
enable_initial_ascent = true        # Post-hatch negative geotaxis ascent
ascent_speed = 0.010                # Ascent swimming speed (~10 mm/s)
ascent_target_depth = -10.0         # Target epipelagic depth (m)
buffer_km = 50.0

# Stochasticity controls, identical to configs/snowcrab.toml. See the note there:
# 0.25 is a placeholder, not a fitted value. Set any to 0.0 for deterministic
# (mean-field) behaviour.
cv_molt = 0.25
cv_mortality = 0.25
cv_settlement = 0.25
settlement_stochastic = true

[dvm]
# Diel vertical migration: larvae rise at night to feed, descend by day to avoid predators.
enable_dvm = true
zoea1_day_depth = -50.0
zoea1_night_depth = -10.0
zoea2_day_depth = -55.0
zoea2_night_depth = -8.0
megalopa_day_depth = -120.0
megalopa_night_depth = -60.0
zoea2_depth_factor = 1.0
megalopa_swim_factor = 1.0

[molting_and_settlement]
# Degree-day phenology for snow crab. T_base = -1.5 degC.
enable_molting = true
t_base = -1.5
dd_zoea1_to_zoea2 = 65.0
dd_zoea2_to_megalopa = 130.0
dd_megalopa_to_settle = 200.0
settlement_min_depth = -350.0
settlement_max_depth = -50.0
settlement_max_temp = 6.0
mortality_base = 0.01
mortality_thermal_threshold = 15.0
mortality_thermal_sensitivity = 0.02
mortality_cold_threshold = 0.0
mortality_cold_sensitivity = 0.01

[storage]
# All output lands under work/opendata/, and the realized configuration is copied there
# as resolved_config.toml for provenance.
output_path = "work/opendata/opendata.jld2"
storage_backend = "zarr"
output_schedule_seconds = 21600.0
checkpoint_fields = ["u", "v", "w", "T", "S", "η"]
enable_checkpoint = true
checkpoint_prefix = "opendata_checkpoint"
checkpoint_schedule_seconds = 21600.0
checkpoint_dir = "work/opendata/checkpoints"
cleanup_checkpoints = true
auto_restart = true

[hardware]
# CPU by default: a keyless run is usually done on shared or laptop hardware, and this
# grid is modest. Set use_gpu = true to exercise the CUDA path.
use_gpu = false
fallback_to_cpu = false             # A GPU request aborts rather than degrading silently

[visualization]
interactive_map = true
title = "Snow Crab Larval Dispersal - Keyless Open Data"

[paths]
# `output_dir` lives in [storage] with the rest of the output settings. `input_dir`
# is the fixed shared cache for ingested data and is not configurable.
seed = 42
